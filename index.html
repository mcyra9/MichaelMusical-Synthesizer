<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Sound Test</title>
    <link id="theme-sheet" rel="stylesheet" href="styles/nostyles.css">
</head>
<body>
    <div id="banner">
        <button><a href="index.html">Home</a></button>
        <button> <a href="keyboard.html">Keyboard</a></button>
        <button style="margin-left: 5px;" onclick="changeTheme()">change theme</button>
    </div>
    <h1> Sound Test V0.19</h1>
    <!-- sliders for frequency, gain and duration -->
    <div id="controls" style="border: 1px solid black; padding: 10px; width: fit-content;">
        <label for="frequency">Frequency (Hz):</label>
        <input type="number" id="frequency" name="frequency" min="20" max="20000" value="440">
        <span>Hz</span> 
        <br>
        <label for="gain">Gain (Volume):</label>
        <input type="range" id="gain" name="gain" min="0" max="1" step="0.01" value="0.5">
        <span id="gainValue">0.5</span>
        <br>
        <label for="duration">Duration (seconds):</label>
        <input type="number" id="duration" name="duration" step="0.5" value="1" style="width: 60px;">
        <span>seconds</span> 
        <br>
            <label for="startTime">starts in </label> 
            <input type="number" id="startTime" name="startTime" step="0.5" value="0" style="width: 60px;">
            <span>seconds</span>
            <label for="endTime">ends in </label>
            <input type="number" id="endTime" name="endTime" step="0.5" value="1" style="width: 60px;">
            <span>seconds</span>
        <br>
        <label for="waveform">Waveform:</label>
        <select id="waveform" name="waveform">
            <option value="sine">Sine</option>
            <option value="square">Square</option>
            <option value="sawtooth">Sawtooth</option>
            <option value="triangle">Triangle</option>
        </select>
        <br>
        <button id="playNowButton">Play Now</button>
        <button id="addSoundButton">Add New Sound</button>
        <button id="saveButton" style="display: none;">Save</button>
    </div>
    <div id="generalButtons" style="margin: 5px 0;">
        <button id="playMelodyButton">Play melody</button>
    </div>
    <div id="melodyList" style="border: 1px solid black; padding: 10px; height:300px; width: 500px; overflow: auto; background-color: azure;">
    </div>

    <script src="audio.js"></script>
    <script src="melody.js"></script>
    <script src="UI.js"></script>
    <script src="style.js"></script>
</body>
</html>
